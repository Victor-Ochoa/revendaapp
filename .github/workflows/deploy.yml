name: Deploy

on:
  # Só depois que o CI concluir com sucesso na main. Com `push` os dois workflows disparavam em
  # paralelo no mesmo commit e o deploy podia publicar um build que o CI ainda reprovaria.
  #
  # `workflow_run` traz dois cuidados que valem a leitura antes de mexer:
  #  - roda a versão do workflow que está na default branch, não a do commit que disparou o CI;
  #  - `github.sha` aqui é o último commit da default branch, NÃO o commit testado. Por isso o
  #    checkout usa `workflow_run.head_sha` (abaixo) — sem ele o deploy taguearia/promoveria a
  #    imagem errada se outro push chegasse enquanto o CI rodava.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

jobs:
  deploy:
    name: Deploy (Production)
    runs-on: ubuntu-latest
    environment: Production
    permissions:
      contents: read
    timeout-minutes: 45

    # `workflow_run` dispara também quando o CI FALHA; sem esta guarda o deploy publicaria um
    # commit reprovado. `workflow_dispatch` (deploy manual) não traz `workflow_run` no payload —
    # nesse caso o evento é nulo e o job roda, que é o esperado para um deploy manual.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')

    steps:
      - uses: actions/checkout@v4
        with:
          # O commit que o CI testou — não o último da default branch (ver o comentário em `on`).
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install Aspire CLI
        run: curl -sSL https://aspire.dev/install.sh | bash

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add known hosts
        run: ssh-keyscan -H ${{ secrets.TARGET_HOST }} >> ~/.ssh/known_hosts

      - name: Set short SHA
        # `GITHUB_SHA` no evento `workflow_run` é o último commit da default branch, não o commit
        # que o checkout pegou. Usar `git rev-parse` garante que a tag da imagem corresponde ao
        # código realmente publicado.
        run: echo "SHORT_SHA=$(git rev-parse --short=7 HEAD)" >> $GITHUB_ENV

      # Docker login manual antes do deploy: evita o passo login-to-registry do
      # aspire-ssh-deploy 0.1.0-ci.153 que quebra com 'IContainerRuntime' não registrado
      # (Aspire.Hosting.Docker 13.6.1). O push das imagens para o registry Magalu passa
      # pelo daemon local autenticado; na VM o pull usa as creds já persistidas em
      # ~/.docker/config.json (setup único).
      - name: Login to Magalu registry
        run: |
          echo "${{ secrets.DOCKER_REGISTRY_PASSWORD }}" | \
            docker login "${{ secrets.DOCKER_REGISTRY_URL }}" \
              -u "${{ secrets.DOCKER_REGISTRY_USERNAME }}" --password-stdin

      - name: Deploy
        run: aspire deploy -e Production
        env:
          DockerSSH__TargetHost: ${{ secrets.TARGET_HOST }}
          DockerSSH__SshUsername: ${{ secrets.SSH_USERNAME }}
          DockerRegistry__RegistryUrl: ${{ secrets.DOCKER_REGISTRY_URL }}
          DockerRegistry__RepositoryPrefix: ${{ secrets.DOCKER_REGISTRY_PREFIX }}
          IMAGE_TAG_SUFFIX: build.${{ github.run_number }}.${{ env.SHORT_SHA }}
          Parameters__postgres-password: ${{ secrets.POSTGRES_PASSWORD }}
          Parameters__seed-admin-email: ${{ secrets.SEED_ADMIN_EMAIL }}
          Parameters__seed-admin-password: ${{ secrets.SEED_ADMIN_PASSWORD }}